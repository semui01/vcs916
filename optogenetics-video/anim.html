<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hijacked Light — Optogenetics</title>
<style>
  html, body { margin:0; background:#000; }
  body { display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px; color:#ccc; font:13px Inter, sans-serif; }
  canvas { height:calc(100vh - 60px); aspect-ratio:9/16; background:#000; }
  body.render { padding:0; } body.render canvas { height:auto; width:1080px; } body.render #ui { display:none; }
  #ui { display:flex; gap:8px; align-items:center; width:min(100%, 600px); } #ui input { flex:1; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="play">Play</button><input id="scrub" type="range" min="0" max="80" step="0.0333" value="0"><span id="tt">0.00</span></div>
<script src="timeline.js"></script>
<script>
'use strict';
/* =====================================================================
   HIJACKED LIGHT — 80 s, 1080×1920 motion graphic for the optogenetics script.
   Everything is a pure function of time: render(t) draws frame t.
   ===================================================================== */
const W = 1080, H = 1920, DURATION = 80, FPS = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;

/* ---------- math / easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutC = k => 1 - Math.pow(1 - k, 3);
const eInC = k => k * k * k;
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutBack = k => { if (k <= 0) return 0;  const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const eOutElastic = k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (TAU / 3)) + 1;
const eOutExpo = k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const pulse = (t, at, len) => (t >= at && t < at + len) ? Math.sin(Math.PI * (t - at) / len) : 0; // 0→1→0 bump
const decay = (t, at, k = 6) => t < at ? 0 : Math.exp(-(t - at) * k);

/* ---------- palette ---------- */
const C = {
  cyan: '#38e1ff', blue: '#2f7bff', laser: '#4aa8ff', ink: '#060914', navy: '#0a1230',
  green: '#7dff6a', algae: '#3fd46b', moss: '#1e7a3e', gold: '#ffc94a', sun: '#ffb03a',
  red: '#ff4d5e', magenta: '#ff4fd8', violet: '#8b6bff', white: '#f4f7ff', amber: '#ffa62b',
};
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* ---------- fonts ---------- */
const F = {
  black: s => `900 ${s}px "Inter Display", Inter, sans-serif`,
  xbold: s => `800 ${s}px Inter, sans-serif`,
  bold: s => `700 ${s}px Inter, sans-serif`,
  semi: s => `600 ${s}px Inter, sans-serif`,
  med: s => `500 ${s}px Inter, sans-serif`,
  mono: s => `700 ${s}px "DejaVu Sans Mono", monospace`,
  serif: s => `italic 700 ${s}px FreeSerif, "DejaVu Serif", serif`,
  serifR: s => `700 ${s}px FreeSerif, "DejaVu Serif", serif`,
};

/* =====================================================================
   TIMELINE: chunks → words (estimated per-word timing) → scenes
   ===================================================================== */
const TL = window.TL;
const syl = w => { if (/\d/.test(w)) return 5; w = w.toLowerCase().replace(/[^a-z]/g, ''); if (!w) return 1; const m = w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '').replace(/^y/, '').match(/[aeiouy]{1,2}/g); return Math.max(1, m ? m.length : 1); };
const norm = w => w.toLowerCase().replace(/[^a-z0-9]/g, '');
const WORDS = [];
TL.chunks.forEach(ch => {
  const ws = ch.text.split(/\s+/);
  const wts = ws.map(w => 0.55 + syl(w) + (/[,;]$/.test(w) ? 0.9 : 0));
  const sum = wts.reduce((a, b) => a + b, 0);
  let acc = ch.start; ch.words = [];
  ws.forEach((w, i) => {
    const d = (ch.end - ch.start) * wts[i] / sum;
    const pauseShare = /[,;]$/.test(w) ? (ch.end - ch.start) * 0.9 / sum : 0;
    const o = { text: w, n: norm(w), start: acc, end: acc + d - pauseShare, chunk: ch.i, scene: ch.scene };
    ch.words.push(o); WORDS.push(o); acc += d;
  });
});
/** absolute time a word starts (first match at/after `after`) */
function at(word, after = 0) { const n = norm(word); const w = WORDS.find(o => o.n.startsWith(n) && o.start >= after - 0.001); return w ? w.start : after; }
function atEnd(word, after = 0) { const n = norm(word); const w = WORDS.find(o => o.n.startsWith(n) && o.start >= after - 0.001); return w ? w.end : after; }

const SCENES = [];
for (let s = 1; s <= 11; s++) {
  const chs = TL.chunks.filter(c => c.scene === s);
  SCENES.push({ id: s, start: s === 1 ? 0 : chs[0].start - 0.32, vo: chs[0].start });
}
SCENES.forEach((sc, i) => sc.end = i < SCENES.length - 1 ? SCENES[i + 1].start : DURATION);
const S = id => SCENES[id - 1];

/* SFX cue sheet, collected while scenes are defined (read by the audio builder) */
const CUES = [];
const cue = (type, t, opt = {}) => CUES.push(Object.assign({ type, t: +t.toFixed(3) }, opt));

/* =====================================================================
   SHARED DRAWING KIT
   ===================================================================== */
function glowCircle(g, x, y, r, color, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, rgba(color, a)); gr.addColorStop(0.35, rgba(color, a * 0.35)); gr.addColorStop(1, rgba(color, 0));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}
function withGlow(g, color, blur, fn) { g.save(); g.shadowColor = color; g.shadowBlur = blur; fn(); g.restore(); }
function text(g, str, x, y, font, color, align = 'center', base = 'middle', spacing = 0) {
  g.font = font; g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
  if (spacing) { g.letterSpacing = spacing + 'px'; }
  g.fillText(str, x, y);
  if (spacing) g.letterSpacing = '0px';
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

/* Starfield / bokeh backdrop, deterministic */
const BOKEH = (() => { const r = rng(7); return Array.from({ length: 70 }, () => ({ x: r(), y: r(), z: 0.2 + r() * 0.8, s: r(), p: r() * TAU })); })();
function backdrop(g, t, top, bot, accent, density = 1) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, top); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.save(); g.globalCompositeOperation = 'lighter';
  BOKEH.forEach((b, i) => {
    if (i / BOKEH.length > density) return;
    const x = (b.x * W + Math.sin(t * 0.2 * b.z + b.p) * 40) % W;
    const y = ((b.y * H - t * 18 * b.z) % H + H) % H;
    const r = 3 + b.z * 22 * (0.6 + b.s);
    glowCircle(g, x, y, r * 2.2, accent, 0.10 * b.z * (0.6 + 0.4 * Math.sin(t * 1.3 + b.p)));
  });
  g.restore();
}
function hudGrid(g, a, color = C.cyan) {
  g.save(); g.strokeStyle = rgba(color, 0.06 * a); g.lineWidth = 1;
  for (let x = 0; x <= W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.restore();
}
function callout(g, x1, y1, x2, y2, label, sub, k, color, align = 'left') {
  if (k <= 0) return;
  g.save(); g.globalAlpha = clamp(k * 3);
  const ex = lerp(x1, x2, eOutC(clamp(k * 1.6)));
  const ey = lerp(y1, y2, eOutC(clamp(k * 1.6)));
  g.strokeStyle = color; g.lineWidth = 3; g.beginPath(); g.moveTo(x1, y1); g.lineTo(ex, ey); g.stroke();
  g.fillStyle = color; g.beginPath(); g.arc(x1, y1, 8, 0, TAU); g.fill();
  glowCircle(g, x1, y1, 40, color, 0.6);
  const tk = clamp((k - 0.35) * 2);
  if (tk > 0) {
    const n = Math.ceil(label.length * tk);
    const dx = align === 'left' ? 14 : -14;
    text(g, label.slice(0, n), x2 + dx, y2 - 22, F.xbold(42), C.white, align, 'middle', 2);
    if (sub) { g.globalAlpha = clamp(k * 3) * clamp((k - 0.6) * 3); text(g, sub, x2 + dx, y2 + 22, F.med(30), color, align, 'middle', 1); }
  }
  g.restore();
}
function chip(g, x, y, label, color, k, font = F.xbold(36)) {
  if (k <= 0) return;
  g.save(); g.font = font; g.letterSpacing = '3px';
  const w = g.measureText(label).width + 56, h = 70;
  const s = eOutBack(clamp(k));
  g.translate(x, y); g.scale(s, s); g.globalAlpha = clamp(k * 2);
  roundRect(g, -w / 2, -h / 2, w, h, h / 2); g.fillStyle = rgba(color, 0.16); g.fill();
  g.strokeStyle = color; g.lineWidth = 3; g.stroke();
  g.fillStyle = C.white; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(label, 0, 2);
  g.restore();
}
/* big stamp text that slams in */
function stamp(g, str, x, y, size, color, tIn, t, rot = -0.06, outT = 99) {
  const k = prog(t, tIn, tIn + 0.28); if (k <= 0) return;
  const ko = 1 - prog(t, outT, outT + 0.3);
  g.save(); g.translate(x, y); g.rotate(rot);
  const s = lerp(2.4, 1, eOutC(k)) * (1 + 0.04 * decay(t, tIn + 0.28, 8));
  g.scale(s, s); g.globalAlpha = clamp(k * 1.5) * ko;
  g.font = F.black(size); g.textAlign = 'center'; g.textBaseline = 'middle'; g.letterSpacing = '4px';
  const w = g.measureText(str).width + 60;
  g.strokeStyle = color; g.lineWidth = 8; roundRect(g, -w / 2, -size * 0.72, w, size * 1.44, 18); g.stroke();
  g.shadowColor = color; g.shadowBlur = 40; g.fillStyle = color; g.fillText(str, 0, 6);
  g.restore();
}

/* ---------- ALGAE CELL (Chlamydomonas) — unit radius ~1 ---------- */
function drawAlgae(g, x, y, s, t, opt = {}) {
  const { rot = 0, eye = 0, beat = 1, alpha = 1, detail = true } = opt;
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.globalAlpha *= alpha;
  // flagella: breaststroke, two whips from the anterior (top)
  const ph = t * 7 * beat;
  for (const side of [-1, 1]) {
    const sw = Math.sin(ph) * 0.9;
    g.beginPath(); g.moveTo(side * 0.12, -1.18);
    const a = side * (0.5 + sw * 0.5);
    g.bezierCurveTo(side * 0.4 + a * 0.2, -1.9, side * (0.9 + sw * 0.6), -2.2 + sw * 0.3, side * (1.25 + sw * 0.9), -1.6 + sw * 1.1);
    g.strokeStyle = 'rgba(200,255,210,0.85)'; g.lineWidth = 0.06; g.lineCap = 'round'; g.stroke();
  }
  // wall halo
  const halo = g.createRadialGradient(0, 0, 0.8, 0, 0, 1.35); halo.addColorStop(0, 'rgba(120,255,160,0.25)'); halo.addColorStop(1, 'rgba(120,255,160,0)');
  g.fillStyle = halo; g.beginPath(); g.ellipse(0, 0, 1.35, 1.6, 0, 0, TAU); g.fill();
  // body
  const body = g.createRadialGradient(-0.25, -0.35, 0.1, 0, 0, 1.25);
  body.addColorStop(0, '#b9ffb0'); body.addColorStop(0.45, '#4fd36a'); body.addColorStop(1, '#1b7a3a');
  g.fillStyle = body; g.beginPath(); g.ellipse(0, 0, 0.95, 1.2, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(220,255,225,0.7)'; g.lineWidth = 0.04; g.stroke();
  if (detail) {
    // cup-shaped chloroplast
    g.fillStyle = 'rgba(20,110,45,0.55)';
    g.beginPath(); g.ellipse(0, 0.15, 0.82, 0.98, 0, 0.05 * Math.PI, 0.95 * Math.PI); g.ellipse(0, 0.0, 0.55, 0.6, 0, 0.95 * Math.PI, 0.05 * Math.PI, true); g.fill();
    // pyrenoid
    g.fillStyle = 'rgba(210,255,200,0.55)'; g.beginPath(); g.arc(0, 0.55, 0.2, 0, TAU); g.fill();
    // nucleus
    g.fillStyle = 'rgba(235,255,240,0.35)'; g.beginPath(); g.arc(0, -0.25, 0.28, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.arc(0.05, -0.27, 0.09, 0, TAU); g.fill();
    // contractile vacuoles
    g.fillStyle = 'rgba(255,255,255,0.25)'; g.beginPath(); g.arc(-0.2, -0.85, 0.08, 0, TAU); g.arc(0.2, -0.85, 0.08, 0, TAU); g.fill();
  }
  // eyespot (stigma)
  const ex = 0.72, ey = -0.2;
  if (eye > 0) { g.save(); g.globalCompositeOperation = 'lighter'; glowCircle(g, ex, ey, 0.9 * eye, C.amber, 0.9 * eye); g.restore(); }
  g.fillStyle = '#ff5a2b'; g.beginPath(); g.ellipse(ex, ey, 0.12, 0.2, 0.3, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,220,120,0.9)'; g.beginPath(); g.ellipse(ex - 0.02, ey - 0.06, 0.04, 0.07, 0.3, 0, TAU); g.fill();
  g.restore();
}

/* ---------- NEURON — unit: soma radius ~1 ---------- */
const DENDRITES = (() => {
  const r = rng(42), segs = [];
  function branch(x, y, ang, len, depth, w) {
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    const mx = (x + x2) / 2 + Math.cos(ang + 1.57) * len * 0.15 * (r() - 0.5) * 2, my = (y + y2) / 2 + Math.sin(ang + 1.57) * len * 0.15 * (r() - 0.5) * 2;
    segs.push({ x, y, mx, my, x2, y2, w, depth });
    if (depth < 3) { const n = 2; for (let i = 0; i < n; i++) branch(x2, y2, ang + (i ? 1 : -1) * (0.35 + r() * 0.35), len * (0.62 + r() * 0.15), depth + 1, w * 0.62); }
  }
  [-2.55, -1.95, -1.15, -0.55, 0.15, 2.9, 2.35].forEach(a => branch(Math.cos(a) * 0.9, Math.sin(a) * 0.9, a, 1.25 + r() * 0.5, 0, 0.32));
  return segs;
})();
function axonPath(len) { return k => ({ x: Math.sin(k * 3.2) * 0.35 * k, y: 0.9 + k * len }); }
function drawNeuron(g, x, y, s, t, opt = {}) {
  const { alpha = 1, color = '#9fb6ff', lit = 0, channels = 0, axonLen = 4, ap = -1, glowCol = C.cyan } = opt;
  g.save(); g.translate(x, y); g.scale(s, s); g.globalAlpha *= alpha; g.lineCap = 'round';
  const ax = axonPath(axonLen);
  // glow underlay when lit
  if (lit > 0) { g.save(); g.globalCompositeOperation = 'lighter'; glowCircle(g, 0, 0, 4.5, glowCol, 0.55 * lit); g.restore(); }
  // dendrites
  const dc = lit > 0 ? mixHex(color, '#dff6ff', lit) : color;
  DENDRITES.forEach(d => { g.strokeStyle = dc; g.lineWidth = d.w; g.beginPath(); g.moveTo(d.x, d.y); g.quadraticCurveTo(d.mx, d.my, d.x2, d.y2); g.stroke(); });
  // axon
  g.strokeStyle = dc; g.lineWidth = 0.28; g.beginPath();
  for (let k = 0; k <= 1.0001; k += 0.02) { const p = ax(k); k === 0 ? g.moveTo(p.x, p.y) : g.lineTo(p.x, p.y); } g.stroke();
  // myelin segments
  g.strokeStyle = rgba('#ffffff', 0.18); g.lineWidth = 0.5;
  for (let k = 0.12; k < 0.95; k += 0.14) { g.beginPath(); const p1 = ax(k), p2 = ax(k + 0.08); g.moveTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); g.stroke(); }
  // axon terminals
  const end = ax(1);
  for (const a of [-0.6, 0, 0.6]) { g.lineWidth = 0.14; g.beginPath(); g.moveTo(end.x, end.y); g.lineTo(end.x + Math.sin(a) * 0.8, end.y + Math.cos(a) * 0.8); g.stroke(); g.fillStyle = dc; g.beginPath(); g.arc(end.x + Math.sin(a) * 0.8, end.y + Math.cos(a) * 0.8, 0.18, 0, TAU); g.fill(); }
  // soma
  const sg = g.createRadialGradient(-0.3, -0.3, 0.1, 0, 0, 1.2);
  sg.addColorStop(0, lit > 0 ? '#ffffff' : '#dbe5ff'); sg.addColorStop(0.5, dc); sg.addColorStop(1, mixHex(dc, '#1a2050', 0.5));
  g.fillStyle = sg; g.beginPath(); g.arc(0, 0, 1.05, 0, TAU); g.fill();
  g.fillStyle = 'rgba(40,40,110,0.45)'; g.beginPath(); g.arc(0.1, -0.05, 0.38, 0, TAU); g.fill();
  // implanted channelrhodopsin dots
  if (channels > 0) {
    g.save(); g.globalCompositeOperation = 'lighter';
    const r = rng(9); const n = Math.floor(70 * channels);
    for (let i = 0; i < n; i++) {
      let px, py;
      if (i % 3 === 0) { const a = r() * TAU; px = Math.cos(a) * 1.05; py = Math.sin(a) * 1.05; }
      else { const d = DENDRITES[Math.floor(r() * DENDRITES.length)]; const k = r(); px = lerp(d.x, d.x2, k); py = lerp(d.y, d.y2, k); }
      const tw = 0.6 + 0.4 * Math.sin(t * 5 + i);
      glowCircle(g, px, py, 0.32, C.cyan, 0.9 * tw); g.fillStyle = '#e8fbff'; g.beginPath(); g.arc(px, py, 0.06, 0, TAU); g.fill();
    }
    g.restore();
  }
  // action potential traveling down axon
  if (ap >= 0 && ap <= 1.1) {
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let j = 0; j < 8; j++) { const k = clamp(ap - j * 0.02); const p = ax(k); glowCircle(g, p.x, p.y, 0.9 - j * 0.08, C.cyan, 0.9 - j * 0.1); }
    const p = ax(clamp(ap)); g.fillStyle = '#fff'; g.beginPath(); g.arc(p.x, p.y, 0.16, 0, TAU); g.fill();
    g.restore();
  }
  g.restore();
}
function mixHex(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, k)), gg = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, k)), bb = Math.round(lerp(pa & 255, pb & 255, k));
  return '#' + ((1 << 24) | (r << 16) | (gg << 8) | bb).toString(16).slice(1);
}

/* ---------- BRAIN (side view) — unit ~1 = half width ---------- */
const BRAIN = (() => {
  const p = new Path2D();
  p.moveTo(-1.0, 0.1);
  p.bezierCurveTo(-1.06, -0.45, -0.62, -0.86, -0.05, -0.84);
  p.bezierCurveTo(0.52, -0.84, 1.0, -0.52, 1.0, -0.04);
  p.bezierCurveTo(1.02, 0.24, 0.88, 0.36, 0.64, 0.34);
  p.bezierCurveTo(0.44, 0.33, 0.33, 0.27, 0.18, 0.31);
  p.bezierCurveTo(-0.08, 0.42, -0.45, 0.5, -0.7, 0.42);
  p.bezierCurveTo(-0.92, 0.36, -0.98, 0.25, -1.0, 0.1); p.closePath();
  const cb = new Path2D(); cb.ellipse(0.62, 0.47, 0.32, 0.19, -0.12, 0, TAU);
  const stem = new Path2D(); stem.moveTo(0.22, 0.3); stem.bezierCurveTo(0.3, 0.55, 0.32, 0.75, 0.3, 0.98); stem.lineTo(0.46, 0.98); stem.bezierCurveTo(0.47, 0.72, 0.44, 0.5, 0.42, 0.3); stem.closePath();
  const r = rng(3), gyri = [];
  const oc = document.createElement('canvas').getContext('2d');
  for (let i = 0; i < 26; i++) {
    let x0, y0; do { x0 = -1 + r() * 2; y0 = -0.9 + r() * 1.3; } while (!oc.isPointInPath(p, x0, y0));
    const pts = []; let x = x0, y = y0, a = r() * TAU;
    for (let j = 0; j < 14; j++) { a += (r() - 0.5) * 1.6; x += Math.cos(a) * 0.07; y += Math.sin(a) * 0.07; pts.push([x, y]); }
    gyri.push(pts);
  }
  const nodes = [];
  while (nodes.length < 70) { const x = -1 + r() * 2, y = -0.9 + r() * 1.3; if (oc.isPointInPath(p, x, y)) nodes.push({ x, y, ph: r() * TAU }); }
  const edges = [];
  nodes.forEach((a, i) => nodes.forEach((b, j) => { if (j > i && Math.hypot(a.x - b.x, a.y - b.y) < 0.27) edges.push([i, j]); }));
  return { p, cb, stem, gyri, nodes, edges };
})();
/** activity(x,y) → 0..1 brightness per node */
function drawBrain(g, x, y, s, t, opt = {}) {
  const { alpha = 1, activity = null, line = C.cyan, fill = '#141c48', net = 1 } = opt;
  g.save(); g.translate(x, y); g.scale(s, s); g.globalAlpha *= alpha; g.lineJoin = 'round'; g.lineCap = 'round';
  const lw = 1 / s;
  // stem + cerebellum
  g.fillStyle = mixHex(fill, '#000000', 0.2); g.fill(BRAIN.stem); g.strokeStyle = rgba(line, 0.7); g.lineWidth = 3 * lw; g.stroke(BRAIN.stem);
  g.fillStyle = mixHex(fill, '#2a3a80', 0.3); g.fill(BRAIN.cb); g.stroke(BRAIN.cb);
  g.save(); g.clip(BRAIN.cb); g.strokeStyle = rgba(line, 0.35); g.lineWidth = 2 * lw;
  for (let i = -6; i <= 6; i++) { g.beginPath(); g.ellipse(0.62, 0.47 + i * 0.035, 0.3, 0.03, -0.12, 0, Math.PI); g.stroke(); }
  g.restore();
  // cerebrum
  const gr = g.createLinearGradient(0, -0.85, 0, 0.5); gr.addColorStop(0, mixHex(fill, '#3044a0', 0.35)); gr.addColorStop(1, fill);
  g.fillStyle = gr; g.fill(BRAIN.p);
  g.save(); g.clip(BRAIN.p);
  g.strokeStyle = rgba(line, 0.22); g.lineWidth = 5 * lw;
  BRAIN.gyri.forEach(pts => { g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.stroke(); });
  // lateral sulcus
  g.strokeStyle = rgba(line, 0.4); g.lineWidth = 5 * lw; g.beginPath(); g.moveTo(-0.55, 0.12); g.bezierCurveTo(-0.2, 0.0, 0.1, -0.05, 0.45, -0.12); g.stroke();
  // network
  if (net > 0) {
    const act = BRAIN.nodes.map(n => activity ? activity(n.x, n.y, n.ph) : 0);
    g.globalCompositeOperation = 'lighter';
    BRAIN.edges.forEach(([i, j]) => {
      const a = (act[i] + act[j]) / 2, A = BRAIN.nodes[i], B = BRAIN.nodes[j];
      g.strokeStyle = rgba(C.cyan, (0.08 + 0.7 * a) * net); g.lineWidth = (1.5 + 3 * a) * lw;
      g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke();
    });
    BRAIN.nodes.forEach((n, i) => {
      const a = act[i];
      if (a > 0.05) glowCircle(g, n.x, n.y, 0.12 * (0.5 + a), C.cyan, a * net);
      g.fillStyle = rgba('#cdf6ff', (0.25 + 0.75 * a) * net); g.beginPath(); g.arc(n.x, n.y, (4 + 4 * a) * lw, 0, TAU); g.fill();
    });
  }
  g.restore();
  g.strokeStyle = line; g.lineWidth = 5 * lw; g.shadowColor = line; g.shadowBlur = 20; g.stroke(BRAIN.p);
  g.restore();
}

/* ---------- OPTICAL FIBER + LASER ---------- */
function drawFiber(g, x, yTop, yTip, t, opt = {}) {
  const { on = 0, pulses = [], width = 16, ferrule = true } = opt;
  // cladding
  g.save(); g.lineCap = 'round';
  g.strokeStyle = '#2a3346'; g.lineWidth = width + 10; g.beginPath(); g.moveTo(x, yTop); g.lineTo(x, yTip); g.stroke();
  g.strokeStyle = '#8ea4c8'; g.lineWidth = width * 0.5; g.beginPath(); g.moveTo(x, yTop); g.lineTo(x, yTip); g.stroke();
  if (ferrule) { const fy = yTip - 150; roundRect(g, x - width * 1.6, fy - 70, width * 3.2, 90, 10); const fg = g.createLinearGradient(x - 30, 0, x + 30, 0); fg.addColorStop(0, '#6c7a90'); fg.addColorStop(0.5, '#e8eef8'); fg.addColorStop(1, '#5a6578'); g.fillStyle = fg; g.fill(); }
  // light inside core
  if (on > 0) {
    g.globalCompositeOperation = 'lighter';
    g.strokeStyle = rgba(C.laser, 0.55 * on); g.lineWidth = width * 0.7; g.shadowColor = C.laser; g.shadowBlur = 30;
    g.beginPath(); g.moveTo(x, yTop); g.lineTo(x, yTip); g.stroke(); g.shadowBlur = 0;
    pulses.forEach(pp => {
      if (pp < 0 || pp > 1.25) return;
      const yy = lerp(yTop, yTip, clamp(pp));
      const gr = g.createLinearGradient(0, yy - 220, 0, yy + 20); gr.addColorStop(0, rgba(C.laser, 0)); gr.addColorStop(1, rgba('#d8f0ff', 1));
      g.strokeStyle = gr; g.lineWidth = width; g.beginPath(); g.moveTo(x, Math.max(yTop, yy - 220)); g.lineTo(x, Math.min(yy, yTip)); g.stroke();
    });
    // tip cone
    const k = on;
    const cone = g.createRadialGradient(x, yTip, 0, x, yTip, 260); cone.addColorStop(0, rgba('#e5f6ff', 0.95 * k)); cone.addColorStop(0.2, rgba(C.laser, 0.6 * k)); cone.addColorStop(1, rgba(C.blue, 0));
    g.fillStyle = cone; g.beginPath(); g.moveTo(x, yTip); g.arc(x, yTip, 260, Math.PI * 0.2, Math.PI * 0.8); g.closePath(); g.fill();
    glowCircle(g, x, yTip, 120, C.laser, 0.9 * k);
  }
  g.restore();
}

/* ---------- MOUSE (top-down) ---------- */
function drawMouse(g, x, y, ang, s, t, opt = {}) {
  const { run = 1, ferrule = 0, alpha = 1 } = opt;
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(s, s); g.globalAlpha *= alpha;
  const st = t * 18 * run;
  // tail
  g.strokeStyle = '#e7a9b4'; g.lineCap = 'round'; g.lineWidth = 0.09;
  g.beginPath(); g.moveTo(-0.95, 0);
  g.bezierCurveTo(-1.5, Math.sin(st * 0.5) * 0.4, -1.9, -Math.sin(st * 0.5 + 1) * 0.5, -2.5, Math.sin(st * 0.5 + 2) * 0.4); g.stroke();
  // feet
  g.fillStyle = '#f1b9c3';
  for (const [fx, fy, ph] of [[0.45, 0.42, 0], [0.45, -0.42, Math.PI], [-0.55, 0.48, Math.PI], [-0.55, -0.48, 0]]) {
    const o = Math.sin(st + ph) * 0.12 * run; g.beginPath(); g.ellipse(fx + o, fy, 0.12, 0.08, 0, 0, TAU); g.fill();
  }
  // body
  const bg = g.createRadialGradient(0.1, -0.15, 0.1, 0, 0, 1.1); bg.addColorStop(0, '#f6f7fb'); bg.addColorStop(1, '#a9b0c4');
  g.fillStyle = bg; g.beginPath(); g.ellipse(-0.1, 0, 0.95, 0.55 + Math.sin(st) * 0.02, 0, 0, TAU); g.fill();
  // head
  g.beginPath(); g.moveTo(0.55, -0.38); g.quadraticCurveTo(1.45, -0.08, 1.35, 0); g.quadraticCurveTo(1.45, 0.08, 0.55, 0.38); g.closePath(); g.fill();
  // ears
  for (const sgn of [-1, 1]) { g.fillStyle = '#c7cddc'; g.beginPath(); g.ellipse(0.62, sgn * 0.38, 0.2, 0.24, 0, 0, TAU); g.fill(); g.fillStyle = '#f2aab8'; g.beginPath(); g.ellipse(0.63, sgn * 0.38, 0.12, 0.15, 0, 0, TAU); g.fill(); }
  g.fillStyle = '#ff8fa3'; g.beginPath(); g.arc(1.38, 0, 0.06, 0, TAU); g.fill();
  g.fillStyle = '#111'; for (const sgn of [-1, 1]) { g.beginPath(); g.arc(1.0, sgn * 0.16, 0.05, 0, TAU); g.fill(); }
  if (ferrule > 0) { g.globalCompositeOperation = 'lighter'; glowCircle(g, 0.72, 0, 0.9 * ferrule, C.laser, ferrule); g.globalCompositeOperation = 'source-over'; g.fillStyle = '#dfe8f5'; g.beginPath(); g.arc(0.72, 0, 0.13, 0, TAU); g.fill(); }
  g.restore();
}

/* ---------- SUN ---------- */
function drawSun(g, x, y, r, t, a = 1) {
  g.save(); g.globalAlpha *= a; g.globalCompositeOperation = 'lighter';
  glowCircle(g, x, y, r * 5, C.sun, 0.35); glowCircle(g, x, y, r * 2.4, C.gold, 0.6);
  g.translate(x, y);
  for (let i = 0; i < 16; i++) {
    const ang = i / 16 * TAU + t * 0.15, len = r * (1.9 + 0.35 * Math.sin(t * 2 + i * 1.7));
    const gr = g.createLinearGradient(0, 0, Math.cos(ang) * len, Math.sin(ang) * len); gr.addColorStop(0, rgba(C.gold, 0.8)); gr.addColorStop(1, rgba(C.gold, 0));
    g.strokeStyle = gr; g.lineWidth = r * 0.16; g.lineCap = 'round'; g.beginPath(); g.moveTo(Math.cos(ang) * r * 1.1, Math.sin(ang) * r * 1.1); g.lineTo(Math.cos(ang) * len, Math.sin(ang) * len); g.stroke();
  }
  g.globalCompositeOperation = 'source-over';
  const sg = g.createRadialGradient(-r * 0.3, -r * 0.3, 0, 0, 0, r); sg.addColorStop(0, '#fffbe6'); sg.addColorStop(0.6, '#ffd65a'); sg.addColorStop(1, '#ff9d2b');
  g.fillStyle = sg; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
  g.restore();
}

/* ---------- MEMBRANE + CHANNELRHODOPSIN (cross-section) ---------- */
const MEM = { y: 760, thick: 230 };
function drawMembrane(g, t, open, opt = {}) {
  const { cx = 540, alpha = 1, retinal = 0, lightHit = 0 } = opt;
  const top = MEM.y - MEM.thick / 2, bot = MEM.y + MEM.thick / 2;
  g.save(); g.globalAlpha *= alpha;
  // inside/outside tint
  const outG = g.createLinearGradient(0, 0, 0, top); outG.addColorStop(0, 'rgba(40,60,140,0)'); outG.addColorStop(1, 'rgba(60,90,200,0.18)');
  g.fillStyle = outG; g.fillRect(0, 0, W, top);
  // lipids
  const gap = 40;
  for (let x = -20; x < W + 40; x += gap) {
    if (Math.abs(x - cx) < 150) continue;
    const wob = Math.sin(t * 2 + x * 0.05) * 3;
    for (const side of [-1, 1]) {
      const hy = side < 0 ? top + 18 + wob : bot - 18 - wob;
      g.strokeStyle = 'rgba(255,190,120,0.55)'; g.lineWidth = 4; g.lineCap = 'round';
      for (const dx of [-6, 6]) { g.beginPath(); g.moveTo(x + dx, hy); for (let k = 1; k <= 6; k++) g.lineTo(x + dx + Math.sin(k * 1.4 + t * 3 + x) * 3, hy - side * k * 13); g.stroke(); }
      const hg = g.createRadialGradient(x - 5, hy - 5, 2, x, hy, 18); hg.addColorStop(0, '#ffe2b8'); hg.addColorStop(1, '#e0793c');
      g.fillStyle = hg; g.beginPath(); g.arc(x, hy, 17, 0, TAU); g.fill();
    }
  }
  // protein: 7 helices; the two central ones form the gate
  const helW = 50, helH = MEM.thick + 110;
  const order = [-3, 3, -2, 2, -1, 1, 0];
  const pos = { '-3': -128, '-2': -92, '-1': -48, '0': 0, '1': 48, '2': 92, '3': 128 };
  // pore glow when open
  if (open > 0.02) {
    g.save(); g.globalCompositeOperation = 'lighter';
    const pg = g.createLinearGradient(0, top - 60, 0, bot + 60); pg.addColorStop(0, rgba(C.cyan, 0)); pg.addColorStop(0.5, rgba(C.cyan, 0.55 * open)); pg.addColorStop(1, rgba(C.cyan, 0));
    g.fillStyle = pg; g.fillRect(cx - 40 * open, top - 60, 80 * open, MEM.thick + 120); g.restore();
  }
  order.forEach(i => {
    const back = Math.abs(i) % 2 === 1 && Math.abs(i) !== 1 ? 0.55 : 1;
    let x = cx + pos[i];
    if (i < 0) x -= open * (i === -1 ? 52 : 26); if (i > 0) x += open * (i === 1 ? 52 : 26);
    if (i === 0) return; // center slot = the pore
    const tilt = (i < 0 ? -1 : 1) * open * 0.08;
    g.save(); g.translate(x, MEM.y); g.rotate(tilt);
    const hg = g.createLinearGradient(-helW / 2, 0, helW / 2, 0);
    const base = back < 1 ? '#2a6fa8' : '#3fb6e8';
    hg.addColorStop(0, mixHex(base, '#001030', 0.5)); hg.addColorStop(0.45, mixHex(base, '#ffffff', 0.35)); hg.addColorStop(1, mixHex(base, '#001030', 0.6));
    g.fillStyle = hg; roundRect(g, -helW / 2, -helH / 2, helW, helH, helW / 2); g.fill();
    // helix stripes
    g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 3;
    for (let k = -helH / 2 + 20; k < helH / 2 - 10; k += 26) { g.beginPath(); g.moveTo(-helW / 2 + 4, k); g.lineTo(helW / 2 - 4, k + 13); g.stroke(); }
    g.restore();
  });
  // gate flaps (the "door" in the pore)
  const flap = (1 - open);
  g.save(); g.strokeStyle = mixHex('#ff5a7a', '#58ffb0', open); g.lineWidth = 12; g.lineCap = 'round';
  g.shadowColor = g.strokeStyle; g.shadowBlur = 20;
  const gy = MEM.y - 10, fl = 44;
  g.beginPath(); g.moveTo(cx - 44 - open * 52, gy); g.lineTo(cx - 44 - open * 52 + Math.cos(lerp(Math.PI * 0.5, 0, flap) - Math.PI / 2) * fl, gy + Math.sin(lerp(Math.PI * 0.5, 0, flap)) * fl * 0 + (1 - flap) * fl); g.stroke();
  g.beginPath(); g.moveTo(cx + 44 + open * 52, gy); g.lineTo(cx + 44 + open * 52 - Math.cos(lerp(Math.PI * 0.5, 0, flap) - Math.PI / 2) * fl, gy + (1 - flap) * fl); g.stroke();
  g.restore();
  // retinal chromophore (light sensor) — amber zigzag across the bundle
  {
    const rx = cx - 120 - open * 30, ry = MEM.y - 40;
    g.save();
    if (retinal > 0 || lightHit > 0) { g.globalCompositeOperation = 'lighter'; glowCircle(g, rx + 40, ry, 110, C.amber, 0.5 * Math.max(retinal, lightHit)); g.globalCompositeOperation = 'source-over'; }
    g.strokeStyle = '#ffcf5a'; g.lineWidth = 7; g.lineJoin = 'round'; g.shadowColor = C.amber; g.shadowBlur = 16 + 30 * lightHit;
    g.beginPath(); for (let k = 0; k <= 8; k++) { const xx = rx + k * 11, yy = ry + (k % 2 ? -8 : 8) + (lightHit > 0 && k > 4 ? (k - 4) * 5 * lightHit : 0); k ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke();
    g.fillStyle = '#ffcf5a'; g.beginPath(); g.arc(rx, ry + 8, 9, 0, TAU); g.fill();
    g.restore();
  }
  g.restore();
}

/* top-down protein icon (7-helix ring) */
function drawProteinIcon(g, x, y, s, t, open = 0, a = 1) {
  g.save(); g.translate(x, y); g.scale(s, s); g.globalAlpha *= a;
  g.globalCompositeOperation = 'lighter'; glowCircle(g, 0, 0, 2.2, C.cyan, 0.35 + 0.4 * open); g.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 7; i++) {
    const ang = i / 7 * TAU + t * 0.4, rr = 0.95 + open * 0.25;
    const hx = Math.cos(ang) * rr, hy = Math.sin(ang) * rr;
    const hg = g.createRadialGradient(hx - 0.12, hy - 0.12, 0.05, hx, hy, 0.45); hg.addColorStop(0, '#c9f3ff'); hg.addColorStop(0.6, '#3fb6e8'); hg.addColorStop(1, '#174f86');
    g.fillStyle = hg; g.beginPath(); g.arc(hx, hy, 0.42, 0, TAU); g.fill();
  }
  g.fillStyle = open > 0.3 ? rgba(C.cyan, 0.9) : '#0b1022'; g.beginPath(); g.arc(0, 0, 0.18 + open * 0.3, 0, TAU); g.fill();
  g.strokeStyle = '#ffcf5a'; g.lineWidth = 0.09; g.shadowColor = C.amber; g.shadowBlur = 12;
  g.beginPath(); for (let k = 0; k <= 6; k++) { const xx = -0.5 + k * 0.17, yy = 0.55 + (k % 2 ? -0.07 : 0.07); k ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke();
  g.restore();
}

/* DNA double helix strip */
function drawDNA(g, x, y, len, ang, t, a = 1, scale = 1) {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(scale, scale); g.globalAlpha *= a;
  const n = 26;
  for (let i = 0; i <= n; i++) {
    const u = i / n, xx = (u - 0.5) * len, ph = u * TAU * 2.2 + t * 4;
    const y1 = Math.sin(ph) * 34, y2 = Math.sin(ph + Math.PI) * 34;
    g.strokeStyle = i % 2 ? 'rgba(255,207,90,0.8)' : 'rgba(56,225,255,0.8)'; g.lineWidth = 6; g.beginPath(); g.moveTo(xx, y1); g.lineTo(xx, y2); g.stroke();
  }
  for (const off of [0, Math.PI]) {
    g.strokeStyle = off ? '#ff7ad9' : '#7dff6a'; g.lineWidth = 9; g.lineCap = 'round'; g.shadowColor = g.strokeStyle; g.shadowBlur = 14;
    g.beginPath(); for (let i = 0; i <= 60; i++) { const u = i / 60, xx = (u - 0.5) * len, yy = Math.sin(u * TAU * 2.2 + t * 4 + off) * 34; i ? g.lineTo(xx, yy) : g.moveTo(xx, yy); } g.stroke();
  }
  g.restore();
}

/* oscilloscope trace */
function scope(g, x, y, w, h, t, fn, a, color = C.cyan, label = '') {
  if (a <= 0) return;
  g.save(); g.globalAlpha *= a;
  roundRect(g, x, y, w, h, 22); g.fillStyle = 'rgba(4,10,24,0.82)'; g.fill(); g.strokeStyle = rgba(color, 0.5); g.lineWidth = 2; g.stroke();
  g.save(); g.clip();
  g.strokeStyle = rgba(color, 0.1); g.lineWidth = 1;
  for (let gx = x; gx < x + w; gx += 40) { g.beginPath(); g.moveTo(gx, y); g.lineTo(gx, y + h); g.stroke(); }
  for (let gy = y; gy < y + h; gy += 40) { g.beginPath(); g.moveTo(x, gy); g.lineTo(x + w, gy); g.stroke(); }
  g.strokeStyle = color; g.lineWidth = 5; g.shadowColor = color; g.shadowBlur = 18; g.lineJoin = 'round';
  g.beginPath();
  for (let i = 0; i <= w; i += 3) { const v = fn(i / w); const yy = y + h * 0.72 - v * h * 0.58; i ? g.lineTo(x + i, yy) : g.moveTo(x + i, yy); }
  g.stroke(); g.restore();
  if (label) text(g, label, x + 24, y + 30, F.mono(24), rgba(color, 0.85), 'left', 'middle', 2);
  g.restore();
}

/* ions */
const IONS = (() => { const r = rng(11); return Array.from({ length: 64 }, () => ({ x: r(), y: r(), v: 0.5 + r(), ph: r() * TAU, kind: Math.floor(r() * 3), d: r() })); })();
function drawIon(g, x, y, r, kind, a = 1) {
  const col = [C.gold, '#ff7a59', C.magenta][kind];
  g.save(); g.globalAlpha *= a;
  g.globalCompositeOperation = 'lighter'; glowCircle(g, x, y, r * 2.4, col, 0.45); g.globalCompositeOperation = 'source-over';
  const ig = g.createRadialGradient(x - r * 0.3, y - r * 0.3, 1, x, y, r); ig.addColorStop(0, '#fff'); ig.addColorStop(1, col);
  g.fillStyle = ig; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.strokeStyle = '#2a1a00'; g.lineWidth = r * 0.18; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x - r * 0.45, y); g.lineTo(x + r * 0.45, y); g.moveTo(x, y - r * 0.45); g.lineTo(x, y + r * 0.45); g.stroke();
  g.restore();
}

/* =====================================================================
   SCENES — each draw(g, t) gets ABSOLUTE time t (word cues are absolute)
   ===================================================================== */
const DRAW = {};

/* ---- 1 · HOOK: lasers into a living brain → mouse moves ---- */
{
  const s = S(1);
  const tFire = at('fire'), tLaser = at('lasers'), tLiving = at('living'), tInst = at('instantly'), tCtrl = at('control'), tMove = at('movements');
  const PULSE_START = tLaser - 0.15, PULSE_P = 0.42;
  const pulseTimes = []; for (let p = PULSE_START; p < s.end; p += PULSE_P) pulseTimes.push(p);
  pulseTimes.forEach(p => cue('laser', p + 0.0, { gain: 0.8 }));
  cue('boom', 0.05, { gain: 0.9 }); cue('riser', tFire - 1.2, { len: 1.2, gain: 0.5 });
  cue('whoosh', tInst - 0.1, { gain: 0.8 });
  DRAW[1] = (g, t) => {
    backdrop(g, t, '#030614', '#0b1440', C.blue, 0.8);
    hudGrid(g, 1);
    const fireOn = t >= PULSE_START ? 1 : 0;
    const pulseK = pulseTimes.reduce((m, p) => Math.max(m, decay(t, p, 5)), 0);
    const zo = eIO(prog(t, tInst - 0.2, tInst + 0.9));     // zoom-out to the mouse
    // ---- brain close-up ----
    const bS = lerp(400, 70, zo), bx = lerp(540, 540 + 0, zo), by = lerp(860, 520, zo);
    const intro = eOutC(prog(t, 0, 1.0));
    const tipY = lerp(-100, by - bS * 0.62, eOutC(prog(t, 0.3, 1.6)));
    const fx = bx - bS * 0.05;
    g.save(); g.globalAlpha = 1 - zo;
    drawBrain(g, bx, by, bS * lerp(1.15, 1, intro), t, {
      alpha: intro, activity: (x, y, ph) => {
        if (t < PULSE_START) return 0.08 + 0.08 * Math.sin(t * 3 + ph);
        const d = Math.hypot(x + 0.05, y + 0.62);
        let a = 0; pulseTimes.forEach(p => { const age = t - p - 0.12; if (age > 0 && age < 1.2) a = Math.max(a, Math.exp(-Math.pow((d - age * 1.8) * 6, 2)) * (1 - age / 1.2)); });
        return clamp(a + 0.12);
      }
    });
    const pulsesProg = pulseTimes.map(p => (t - p) / 0.14);
    drawFiber(g, fx, -40, tipY, t, { on: fireOn * (0.35 + 0.65 * pulseK), pulses: pulsesProg, width: 18 });
    // ripple rings at the tip
    if (fireOn) pulseTimes.forEach(p => { const age = t - p - 0.12; if (age > 0 && age < 0.9) { g.strokeStyle = rgba(C.laser, 0.8 * (1 - age / 0.9)); g.lineWidth = 6; g.beginPath(); g.arc(fx, tipY, 40 + age * 520, 0, TAU); g.stroke(); } });
    g.restore();
    // ---- arena with tethered mouse ----
    if (zo > 0) {
      g.save(); g.globalAlpha = zo;
      const acx = 540, acy = 820, ar = 380;
      g.translate(acx, acy); g.scale(lerp(2.2, 1, zo), lerp(2.2, 1, zo)); g.translate(-acx, -acy);
      // arena floor

/* ---- 11 · it all traces back to algae finding the sun ---- */
{

    g.strokeStyle = lg; g.lineWidth = 8; g.shadowColor = C.gold; g.shadowBlur = 20; g.beginPath(); g.moveTo(230, ys[0]); g.lineTo(230, yTop); g.stroke(); g.shadowBlur = 0;

/* =====================================================================
   GLOBAL OVERLAYS: captions, kicker HUD, progress, grain, vignette
   ===================================================================== */
const KEYWORDS = {
  laser: C.laser, lasers: C.laser, brain: C.cyan, brains: C.cyan, living: C.cyan, scifi: C.magenta, hijacked: C.red, hijack: C.red,
  '1866': C.gold, green: C.green, pond: C.green, scum: C.green, algae: C.green, algal: C.green, microscopic: C.green, algaes: C.green,
  light: C.gold, sensor: C.gold, sunlight: C.gold, sun: C.gold, half: C.cyan, millisecond: C.cyan, faster: C.cyan,
  twoinone: C.cyan, protein: C.cyan, gate: C.red, closed: C.red, snaps: '#58ffb0', open: '#58ffb0', ions: C.gold, electrical: C.cyan, signal: C.cyan,
  channelrhodopsin: C.violet, wild: C.magenta, idea: C.magenta, mammalian: '#9fb6ff', nerve: '#9fb6ff', worked: '#58ffb0', switch: C.cyan,
  optogenetics: C.cyan, optical: C.laser, fibers: C.laser, pulsing: C.laser, neurons: '#9fb6ff', neuron: '#9fb6ff', movements: C.cyan, memories: C.gold, reflex: C.gold, finding: C.gold,
};
function captions(g, t) {
  // active chunk = last chunk that started, visible until next starts (or 0.6s after end)
  let ch = null;
  for (const c of TL.chunks) if (t >= c.start - 0.08) ch = c;
  if (!ch) return;
  const next = TL.chunks[ch.i + 1];
  const hideAt = next ? Math.min(next.start - 0.08, ch.end + 0.9) : ch.end + 1.2;
  const out = prog(t, hideAt - 0.12, hideAt);
  if (out >= 1) return;
  const size = 68, lh = 86, maxW = 940;
  g.save(); g.font = F.black(size); g.letterSpacing = '0px';
  const sp = g.measureText(' ').width + 14;
  // layout
  const lines = [[]]; let lw = 0;
  ch.words.forEach(w => { const ww = g.measureText(w.text).width; if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push({ w, ww }); lw += ww + sp; });
  const baseY = 1440 - (lines.length - 1) * lh / 2;
  lines.forEach((ln, li) => {
    const tot = ln.reduce((a, o) => a + o.ww, 0) + sp * (ln.length - 1);
    let x = 540 - tot / 2;
    ln.forEach(({ w, ww }) => {
      const k = prog(t, w.start - 0.06, w.start + 0.14);
      const active = t >= w.start - 0.03 && t < w.end + 0.05;
      const kc = KEYWORDS[w.n] || KEYWORDS[w.n.replace(/s$/, '')];
      const col = kc || C.white;
      if (k > 0) {
        const s = lerp(0.7, 1, eOutBack(k)) * (active ? 1.06 : 1);
        g.save(); g.translate(x + ww / 2, baseY + li * lh + (1 - eOutC(k)) * 24 - out * 20);
        g.scale(s, s); g.globalAlpha = clamp(k * 1.8) * (1 - out) * (kc || active ? 1 : 0.92);
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineWidth = 12; g.strokeStyle = 'rgba(0,0,0,0.65)'; g.lineJoin = 'round'; g.strokeText(w.text, 0, 0);
        if (kc && active) { g.shadowColor = kc; g.shadowBlur = 30; }
        g.fillStyle = col; g.fillText(w.text, 0, 0);
        g.restore();
      }
      x += ww + sp;
    });
  });
  g.restore();
}
const KICKERS = ['NEUROSCIENCE · NOW', 'REWIND', 'PHOTOTAXIS', 'SPEED', 'THE SECRET', 'LIGHT → SIGNAL', 'THE PROTEIN', 'THE TRANSPLANT', 'PROOF', 'TODAY', 'THE ORIGIN'];
function hud(g, t) {
  const si = SCENES.findIndex(sc => t >= sc.start && t < sc.end); if (si < 0) return;
  const sc = SCENES[si], k = prog(t, sc.start + 0.15, sc.start + 0.55) * (1 - prog(t, sc.end - 0.2, sc.end)) * (1 - prog(t, 77.2, 77.8));
  g.save(); g.globalAlpha = k;
  const lab = KICKERS[si];
  const sep = si === 1 ? prog(t, S(2).start + 2, S(2).start + 3) : 0;
  const col = mixHex('#ffffff', '#3b2510', sep);
  text(g, String(si + 1).padStart(2, '0') + ' / 11', 80, 150, F.mono(26), rgba(col, 0.55), 'left', 'middle', 3);
  const n = Math.ceil(lab.length * prog(t, sc.start + 0.15, sc.start + 0.6));
  text(g, lab.slice(0, n), 1000, 150, F.mono(26), col, 'right', 'middle', 5);
  g.restore();
  // progress bar
  g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(80, 110, 920, 4);
  const pg = g.createLinearGradient(80, 0, 1000, 0); pg.addColorStop(0, C.green); pg.addColorStop(0.5, C.cyan); pg.addColorStop(1, C.gold);
  g.fillStyle = pg; g.fillRect(80, 110, 920 * clamp(t / DURATION), 4);
}
const GRAIN = Array.from({ length: 6 }, (_, i) => {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960; const g = c.getContext('2d');
  const id = g.createImageData(540, 960), r = rng(1000 + i);
  for (let p = 0; p < id.data.length; p += 4) { const v = r() * 255; id.data[p] = id.data[p + 1] = id.data[p + 2] = v; id.data[p + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
});
function post(g, t) {

  const cb = g.createLinearGradient(0, 1240, 0, 1700); cb.addColorStop(0, 'rgba(0,0,0,0)'); cb.addColorStop(0.5, 'rgba(0,0,0,0.42)'); cb.addColorStop(1, 'rgba(0,0,0,0.0)');

/* =====================================================================
   COMPOSITOR with scene transitions
   ===================================================================== */
const bufA = document.createElement('canvas'), bufB = document.createElement('canvas');
bufA.width = bufB.width = W; bufA.height = bufB.height = H;
const gA = bufA.getContext('2d'), gB = bufB.getContext('2d');
const TR = 0.5;               // transition length
const SEAMLESS = new Set([6]); // 5→6 share one continuous membrane scene
SCENES.forEach((sc, i) => { if (i > 0 && !SEAMLESS.has(sc.id)) cue('whoosh', sc.start - 0.15, { gain: 0.55 }); });

function drawScene(g, id, t) { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H); DRAW[id](g, t); g.restore(); }
function render(t) {
  const si = Math.max(0, SCENES.findIndex(sc => t >= sc.start && t < sc.end)); const sc = SCENES[si === -1 ? SCENES.length - 1 : si];
  const id = t >= DURATION ? 11 : sc.id;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const into = t - sc.start;
  if (sc.id > 1 && into < TR && !SEAMLESS.has(sc.id)) {

    const k = eIO(into / TR);

    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = 1 - k; const s1 = lerp(1, 1.35, k); ctx.translate(540, 860); ctx.scale(s1, s1); ctx.translate(-540, -860); ctx.drawImage(bufA, 0, 0); ctx.restore();
    ctx.save(); ctx.globalAlpha = k; const s2 = lerp(0.82, 1, k); ctx.translate(540, 860); ctx.scale(s2, s2); ctx.translate(-540, -860); ctx.drawImage(bufB, 0, 0); ctx.restore();
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(190,225,255,${0.35 * Math.sin(Math.PI * k)})`; ctx.fillRect(0, 0, W, H); ctx.restore();

  hud(ctx, t);

  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- boot ---------- */
window.CUES = CUES; window.SCENES = SCENES; window.WORDS = WORDS; window.render = render; window.DURATION = DURATION;
window.ready = (async () => {
  await Promise.all([F.black(60), F.xbold(60), F.bold(60), F.semi(60), F.med(60), F.mono(60), F.serif(60), F.serifR(60)].map(f => document.fonts.load(f, 'AaBb19')));

if (!/render/.test(location.hash)) {
  const scrub = document.getElementById('scrub'), tt = document.getElementById('tt'); let playing = false, t0 = 0, base = 0;
  const show = t => { render(t); tt.textContent = t.toFixed(2); scrub.value = t; };
  scrub.oninput = () => { playing = false; show(+scrub.value); };
  document.getElementById('play').onclick = () => { playing = !playing; base = +scrub.value; t0 = performance.now(); const loop = () => { if (!playing) return; const t = base + (performance.now() - t0) / 1000; if (t >= DURATION) { playing = false; return; } show(t); requestAnimationFrame(loop); }; loop(); };
  window.ready.then(() => show(+(location.hash.slice(1)) || 0));
